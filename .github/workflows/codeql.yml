name: Monthly Swift security scan

on:
  schedule:
    # First day of each month at 11:17 Europe/Moscow (08:17 UTC).
    - cron: '17 8 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-swift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze Swift with CodeQL
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Build for analysis
        run: |
          xcodebuild -project Plupo.xcodeproj -scheme Plupo \
            -configuration Debug -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/PlupoCodeQL" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            clean build
      - name: Publish security analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:swift
